name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865

jobs:
  core-aar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-go@v5
        with: { go-version-file: core/upstream/go.mod, cache-dependency-path: core/upstream/go.sum }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK packages (platform, build-tools, NDK r29)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"
      - run: bash scripts/build-core.sh --out android/app/libs
      - uses: actions/upload-artifact@v4
        with: { name: libgopeed-aar, path: android/app/libs/libgopeed.aar }

  android:
    runs-on: ubuntu-latest
    needs: [core-aar]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/download-artifact@v4
        with: { name: libgopeed-aar, path: android/app/libs }
      - uses: actions/setup-go@v5
        with: { go-version-file: core/upstream/go.mod }
      - run: cd core/upstream && go vet ./... && go test ./...
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - name: Install Android SDK packages (platform, build-tools, NDK r29)
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 9.6.0 }
      - run: gradle testDebugUnitTest lint --stacktrace
      - run: gradle assembleDebug assembleRelease --stacktrace
      - run: bash scripts/collect-apks.sh
      - uses: actions/upload-artifact@v4
        with: { name: apks, path: dist/ }
